name: Deploy

# Auto-deploys to the home server after CI succeeds on main.
# Shared secret names with sibling bots (telegram-bot-business-card, tma-food-demo).
# Required repo secrets:
#   DEPLOY_HOST          - server hostname or IP
#   DEPLOY_USER          - SSH user (e.g. admin)
#   DEPLOY_PORT          - SSH port (optional, default 22)
#   DEPLOY_SSH_KEY       - private key contents (whole file with BEGIN/END)
#   DEPLOY_KNOWN_HOSTS   - output of `ssh-keyscan -t ed25519,rsa <host>`
#   DEPLOY_PATH          - optional override (default /home/admin/telegram-bot-ai-assistant)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH deploy to home server
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.head_branch == 'main')
      }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/admin/telegram-bot-ai-assistant' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Run deploy.sh on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash $DEPLOY_PATH/deploy/scripts/deploy.sh"

      - name: Smoke check via SSH
        if: success()
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "curl -fsS -m 5 http://127.0.0.1:8000/health"
