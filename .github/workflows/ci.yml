name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: pip install uv
      - name: Install project (dev extras)
        run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: pip install uv
      - name: Install project (dev extras)
        run: uv sync --locked --extra dev
      - name: mypy
        run: uv run mypy bot api

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: dummy
      OPENAI_API_KEY: sk-dummy
      API_ADMIN_TOKEN: dummy
      ADMIN_IDS: "1"
      SEED_SAMPLE_ON_FIRST_RUN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: pip install uv
      - name: Install project (dev extras)
        run: uv sync --locked --extra dev
      - name: pytest
        run: uv run pytest -v --tb=short

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t telegram-bot-ai-assistant:ci .
