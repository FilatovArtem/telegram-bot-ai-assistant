services:
  bot:
    build: .
    image: telegram-bot-ai-assistant:latest
    container_name: tg-ai-bot
    env_file: .env
    ports:
      # bind to loopback only — публикуй наружу через reverse-proxy (Caddy/Traefik)
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - bot-data:/app/data
    # Allows `host.docker.internal` to resolve to the host (Linux),
    # so the container can reach a proxy running on 127.0.0.1 of the host
    # (e.g. xray on :10808). Used by TELEGRAM_PROXY / HTTPS_PROXY env vars.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  bot-data:
