services:
  bot:
    build: .
    container_name: tg-ai-bot
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  bot-data:
